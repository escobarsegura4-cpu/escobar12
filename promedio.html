<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Promedio</title>

    <style>
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                         'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .aprobado {
            background-color: #d4edda;
            color: #155724;
        }

        .reprobado {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <h2>Calculador de Promedio de Estudiante</h2>

    <!-- Formulario para ingresar los datos -->
    <div class="campo">
        <label for="nombre">Nombre del estudiante:</label>
        <input type="text" id="nombre">

        <label for="nota1">Ingrese la nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label for="nota2">Ingrese la nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label for="nota3">Ingrese la nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcularPromedio()">
            Calcular Promedio
        </button>
    </div>

    <div id="resultado"></div>

    <script>
        function calcularPromedio() {

            // Leer los datos ingresados
            const nombre = document.getElementById("nombre").value.trim();
            const nota1 = parseFloat(document.getElementById("nota1").value);
            const nota2 = parseFloat(document.getElementById("nota2").value);
            const nota3 = parseFloat(document.getElementById("nota3").value);

            const divResultado = document.getElementById("resultado");

            // Validar que todos los campos estén completos
            if (
                !nombre ||
                isNaN(nota1) ||
                isNaN(nota2) ||
                isNaN(nota3)
            ) {
                alert("Por favor, complete todos los campos correctamente.");
                return;
            }

            // Validar que las notas estén entre 0 y 5
            if (
                nota1 < 0 || nota1 > 5 ||
                nota2 < 0 || nota2 > 5 ||
                nota3 < 0 || nota3 > 5
            ) {
                alert("Las notas deben estar entre 0 y 5.");
                return;
            }

            // Calcular el promedio
            const promedio = (nota1 + nota2 + nota3) / 3;

            // Determinar el estado
            const estado = promedio >= 3 ? "Aprobado" : "Reprobado";
            const claseColor = promedio >= 3 ? "aprobado" : "reprobado";

            // Mostrar el resultado
            divResultado.className = claseColor;
            divResultado.style.display = "block";

            divResultado.innerHTML = `
                <p><strong>Estudiante:</strong> ${nombre}</p>
                <p><strong>Promedio:</strong> ${promedio.toFixed(2)}</p>
                <p><strong>Resultado:</strong> ${estado}</p>
            `;
        }
    </script>

</body>
</html>
